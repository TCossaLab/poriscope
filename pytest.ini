[pytest]
#Generate coverage report: 
#pytest --cov=poriscope --cov-report=term-missing --cov-report=html
#start htmlcov/index.html  
 
#-r: Show summary of test results for skipped, failed, xfailed, xpassed
#a: Means "all except passed"
# --strict-markers: a marker name that is not registered below is a collection
# error rather than an expression that matches nothing.
addopts = -ra --strict-markers
testpaths = tests

# Backstop only, in seconds. Nothing here should come close: the slowest unit test
# measures ~1.4 s and the explicit @pytest.mark.timeout markers under tests/e2e and
# tests/integration are all <= 90 s and still override this. Without it a hung Qt
# test runs to GitHub's six-hour job limit. Tripping this value is a finding, not a
# reason to raise it.
timeout = 300

# so pytest-qt picks the right binding.
qt_api = pyside6
# `e2e` and `integration` are applied automatically by path in tests/conftest.py.
# The rest are hand-applied.
# Run `pytest --marker-stats` for per-marker counts and mean durations.
markers =
    compliance: marks tests that validate plugin or interface compliance
    integration: cross-plugin integration tests (auto-applied to tests/integration)
    e2e: end-to-end tests (auto-applied to tests/e2e)
    e2e_ux: click-driven end-to-end UX tests
    smoke: quick sanity-check tests for core tab functionality