[mypy]
# Pin the language/stdlib surface mypy checks against. Nothing pins the
# interpreter the pre-commit hook runs under - mirrors-mypy sets no
# language_version and there is no default_language_version - so without this
# mypy defaults to whatever Python built the hook env, and a contributor on a
# newer interpreter gets a different verdict from CI. Only major.minor is valid
# here (mypy rejects 3.12.10); the patch-level floor lives in pyproject.toml's
# requires-python, which is a different kind of fact.
python_version = 3.12
disallow_untyped_defs = True
check_untyped_defs = True
# Catches comparisons between non-overlapping types, e.g. a display string
# compared against an int channel id. Measured at zero new errors when it was
# turned on, because the type-annotation pass had already fixed every such
# site; it is on to stop that bug class from silently coming back.
strict_equality = True
explicit_package_bases = True
exclude = ^tests/
# Add any other settings here
