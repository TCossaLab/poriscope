# Apply hooks during commit stage
default_stages: [pre-commit]

repos:
  # Code formatting 
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--fast]
        stages: [manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      # Auto-fix hook (manual only)
      - id: ruff
        args: ["--fix"]
        exclude: ^tests/slow/
        stages: [manual]
        # Strict check (commit + CI)
      - id: ruff
        args: ["--exit-non-zero-on-fix"]
        exclude: ^tests/slow/
        stages: [pre-commit]

  # Static Type Checking (runs during default commit stage).
  # Scoped to ^poriscope/ to match mypy.ini's `exclude = ^tests/`. That exclude
  # governs directory *discovery* only, so without this the hook hands mypy the
  # test files as explicit paths and type-checks them anyway.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        # args: ["--strict"]
        files: ^poriscope/

  # Docstring/signature consistency (runs during default commit stage).
  # .pydoclint-baseline.txt is empty as of 2026-08-26 - the ~1,090 grandfathered
  # violations are all cleared, so every violation reported is a real one. Fix it
  # rather than regenerating the baseline. See pyproject.toml's [tool.pydoclint].
  - repo: local
    hooks:
      - id: pydoclint
        name: pydoclint (docstring/signature consistency)
        entry: pydoclint --baseline=.pydoclint-baseline.txt
        language: system
        types: [python]
        files: ^poriscope/

  # Plugin settings-schema self-consistency (runs during default commit stage).
  # Scoped to poriscope/plugins/** rather than all of poriscope/: this only needs
  # to re-run when a plugin's get_empty_settings() could have changed, and it is
  # meant to run ahead of the far more expensive behavioural conformance suite
  # under tests/unit/plugins/conformance/, not duplicate what that already covers.
  # See scripts/check_settings_schema.py and poriscope/utils/settings_schema.py.
  - repo: local
    hooks:
      - id: settings-schema
        name: settings-schema (get_empty_settings self-consistency)
        entry: python scripts/check_settings_schema.py
        language: system
        pass_filenames: false
        files: ^poriscope/plugins/

  # File Size Guard (runs during default commit stage)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=123"]
        exclude: ^\.pydoclint-baseline\.txt$
