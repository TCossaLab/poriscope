# GitHub Actions Workflow: Build Wavelet Libraries
#
# This workflow runs on Ubuntu and:
#  1. Installs required compilers (gcc, mingw-w64).
#  2. Builds the Wavelet library for the two platforms it can build natively:
#       - Linux shared object (.so)
#       - Windows dynamic link library (.dll)
#  3. Uploads the compiled binaries as an artifact.
#  4. Commits and pushes the built binaries in `dist/` back to `develop`
#     (only if there are changes).
#
# Note:
#   - No macOS library is built or shipped: one cross-built here would be a Linux
#     ELF file that macOS cannot load. A macOS user builds one with `make dylib`
#     and points PORISCOPE_WAVELET_PATH at it.
#   - It runs when the C source or the Makefile changes on `develop`, so rebuilt
#     binaries land before a release branch is cut rather than on `main` after the
#     release is tagged. The DLL links without timestamps, so rebuilding unchanged
#     source commits nothing.

name: Build Wavelet (Linux .so, Windows .dll)

on:
  # Manual trigger
  workflow_dispatch:
  # Automatic run when the library's source changes on develop
  push:
    branches: [ develop ]
    paths:
      - "poriscope/cdlls/wavelet/src/**"
      - "poriscope/cdlls/wavelet/lib/**"
      - "poriscope/cdlls/wavelet/Makefile"

# Required so the workflow can push back to the repo
permissions:
  contents: write

# Prevent overlapping runs on the same branch
concurrency:
  group: build-wavelet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository with full history (needed for committing)
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      # 2. Install build toolchains
      - name: Install compilers and make
        run: |
          # The runner image ships apt sources for packages.microsoft.com, which this project
          # never installs from. A 403 there fails `apt-get update` with exit 100 even when
          # every Ubuntu repo fetched fine, which took the whole job down on 2026-09-02.
          # Matches on the repo host, not the filename, so an image rename cannot silently
          # reinstate it. `grep` exits 1 when it matches nothing and steps run under `bash -e`,
          # so the `|| true` is load-bearing - without it the guard fails the step it protects.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc mingw-w64

      # 3. Display versions for debugging
      - name: Show toolchain versions
        run: |
          echo "gcc: $(gcc --version | head -n1)"
          echo "mingw: $(x86_64-w64-mingw32-gcc --version | head -n1)"
          echo "uname: $(uname -a)"

      # 4. Run Makefile to build .so and .dll
      - name: Build Wavelet libraries
        working-directory: poriscope/cdlls/wavelet
        run: |
          make clean
          make so       # Build Linux .so
          make dll      # Build Windows .dll (via mingw)

      # 5. Verify that outputs exist in dist/
      - name: Verify outputs
        working-directory: poriscope/cdlls/wavelet/dist
        run: |
          ls -la
          test -f wavelet.so     || (echo "Missing wavelet.so" && exit 1)
          test -f wavelet.dll    || (echo "Missing wavelet.dll" && exit 1)

      # 6. Upload dist/ as a build artifact
      - name: Upload artifact (dist/)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wavelet-binaries-${{ github.sha }}
          path: poriscope/cdlls/wavelet/dist/*
          if-no-files-found: error
          retention-days: 14

      # 7. Commit and push dist/ updates back to develop (only if changes exist)
      - name: Commit & push dist/ binaries
        if: github.ref == 'refs/heads/develop'
        run: |
          # Configure git identity for commits
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage changes in dist/
          git add -A poriscope/cdlls/wavelet/dist

          # Commit only if there are modifications
          if ! git diff --cached --quiet; then
            git commit -m "chore(wavelet): update built binaries (.so/.dll) [skip ci]"
            git push origin develop
          else
            echo "No changes to commit."
          fi
