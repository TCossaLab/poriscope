# Continuous Deployment: 
# Build and release when pushing to main or tagging a version
name: CD (Build & Release)

on:
  push:
    branches:
      - main              # Trigger on push to main branch
    tags:
      - 'v*'              # Also trigger on version tags like v1.5.1

permissions:
  contents: write         # Required to upload release assets to GitHub
  id-token: write         # Required for trusted publishing to PyPI


# One run per branch; newest cancels older on same branch
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true
  
jobs:
#Zenodo uses CITATION.cff to generate repositories on release, if it the file is broken the whole process fails silently
  validate-citation:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v3
        
  test-build-release:
    name: Run tests, build, and optionally release
    needs: validate-citation
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ steps.upload_release.outputs.url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      # Native libs required for PySide6/Qt on Ubuntu + a virtual display server for GUI tests
      - name: Install system libs for Qt + Xvfb
        run: |
          # The runner image ships apt sources for packages.microsoft.com, which this project
          # never installs from. A 403 there fails `apt-get update` with exit 100 even when
          # every Ubuntu repo fetched fine, which took the whole job down on 2026-09-02.
          # Matches on the repo host, not the filename, so an image rename cannot silently
          # reinstate it. `grep` exits 1 when it matches nothing and steps run under `bash -e`,
          # so the `|| true` is load-bearing - without it the guard fails the step it protects.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine  # Required for building and uploading to PyPI

      - name: Install MinGW-w64 for cross-compiling
        run: |
          # The runner image ships apt sources for packages.microsoft.com, which this project
          # never installs from. A 403 there fails `apt-get update` with exit 100 even when
          # every Ubuntu repo fetched fine, which took the whole job down on 2026-09-02.
          # Matches on the repo host, not the filename, so an image rename cannot silently
          # reinstate it. `grep` exits 1 when it matches nothing and steps run under `bash -e`,
          # so the `|| true` is load-bearing - without it the guard fails the step it protects.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Run tests (unit + E2E)
        run: |
          xvfb-run -a pytest      # Add specific markers (e.g., "not slow") if needed

      # Build the wheel and source distribution
      - name: Build package
        run: python -m build

      # Publish to PyPI only when a version tag is pushed (e.g. v1.5.1)
      #- name: Publish to PyPI
      #  if: startsWith(github.ref, 'refs/tags/v')
      #  env:
      #    TWINE_USERNAME: __token__
      #    TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      #  run: twine upload dist/*

      # Publish to PyPI using trusted publishing (no token needed)
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

      # Create a GitHub Release and upload dist/ assets (only on version tags)
      - name: Create GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*           # Upload all files in the dist/ directory to the release
