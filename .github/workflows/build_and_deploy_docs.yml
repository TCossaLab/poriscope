# Build Sphinx and deploy the generated static site to GitHub Pages
# Branch mode → publishes to gh-pages/docs

name: Build and Deploy Docs to Pages (main)

on:
  # Run automatically on pushes to main. Under git flow main holds the
  # released version, which is what should be published; do not repoint this
  # at develop.
  push:
    branches: ["main"]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Allow pushing to gh-pages
permissions:
  contents: write   # peaceiris needs write to push commits to gh-pages

# One run per branch; newest cancels older on same branch
concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      # 1) Checkout the branch this run was started from
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 2) Qt native libs. conf.py does not mock PySide6, so autodoc imports the real
      #    modules and QtGui/QtWidgets/QtSvg must load. These three are the DT_NEEDED
      #    entries of the bundled libQt6Gui/Widgets/Svg that the runner image does not
      #    already provide, and the loader resolves all of them at import time. The
      #    libxcb-* packages and Xvfb that ci-branches.yml installs are not needed here:
      #    they load with the xcb platform plugin, and a docs build never instantiates a
      #    QApplication. Keep this in step with the same step in docs-check.yml.
      - name: Install Qt native libs
        run: |
          # The runner image ships apt sources for packages.microsoft.com, which this project
          # never installs from. A 403 there fails `apt-get update` with exit 100 even when
          # every Ubuntu repo fetched fine, which took the whole job down on 2026-09-02.
          # Matches on the repo host, not the filename, so an image rename cannot silently
          # reinstate it. `grep` exits 1 when it matches nothing and steps run under `bash -e`,
          # so the `|| true` is load-bearing - without it the guard fails the step it protects.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      # 3) Python & deps
      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install Python dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          # Use requirements if present; otherwise install minimal doc deps
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          else
            pip install sphinx furo
          fi

    # 4) Build Sphinx (source → build)
      - name: Generate .rst files using autodoc generators
        run: python scripts/generate_all_autodoc_rst.py
      
      # -W --keep-going matches the Docs Render Check PR gate, so a warning that
      # somehow reached main fails the deploy instead of publishing broken docs.
      - name: Build Sphinx HTML (docs/source → docs/build)
        run: sphinx-build -W --keep-going -b html docs/source docs/build


      # Ensure GitHub Pages serves _static/ by placing .nojekyll in the publish root
      - name: Add .nojekyll to built site
        run: touch docs/build/.nojekyll

      # Optional sanity checks
      - name: Verify index.html exists
        run: test -f docs/build/index.html || (echo "Missing docs/build/index.html" && exit 1)

      - name: List docs/build (debug)
        run: ls -la docs/build | sed -n '1,200p'

      # 5) Deploy to gh-pages/docs (branch-based Pages; NOT the Actions Pages flow)
      #    Repo Settings → Pages must be: Source = Deploy from a branch • Branch = gh-pages • Folder = /docs
      - name: Deploy to GitHub Pages (gh-pages/docs)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # auto-provided token
          publish_dir: docs/build                    # upload this folder's contents
          publish_branch: gh-pages                   # Pages branch
          destination_dir: docs                      # land the site under /docs on gh-pages
          enable_jekyll: false                       # also writes a root .nojekyll (belt & suspenders)
          force_orphan: true                         # clean deploy (single-commit history)

      # 6) (Optional) downloadable artifact of the built site
      - name: Upload HTML docs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html-docs
          path: docs/build
          if-no-files-found: error
          retention-days: 7
