# CI (Branches)
# -----------------------------------------------------------------------------
# What it does
# - Runs on branch pushes to: develop, feature/*, bugfix/*, hotfix/*, release/*
#   hotfix/* and release/* are included because both are merged into main locally by
#   git flow - there is no pull request in either flow - and release.yml runs only on
#   the version tag, after the merge has landed. Without these triggers the first CI
#   a hotfix or a release-preparation commit ever sees is the release itself; no
#   release/* branch had a single workflow run before 2.0.0.
# - Installs Linux GUI prereqs for PySide6 (EGL/GL/XCB) + Xvfb virtual display
# - Sets up Python, caches pip by requirements files
# - Installs runtime + dev deps
# - Runs pre-commit in two phases:
#     1) Auto-fix (non-blocking)
#     2) Strict validation (blocking)
# - Commits auto-fixes back to the branch if needed
# - Runs the full test suite on ubuntu-latest under Xvfb and on windows-latest
#   offscreen (no marker filter, e2e included). Windows is the platform users run
#   and the one the ten platform-conditional sites - including the wavelet DLL load
#   in WaveletFilter - take the other branch on; until 2.1 no job ran there.
#   Lint, auto-fix and the mypy report run on the Linux leg only: their results do
#   not depend on the platform, and two legs pushing auto-fixes would race.
# - In a second job, builds the wheel and sdist, checks them with twine, installs the
#   wheel into a fresh venv and imports it with the wavelet binary (see `wheel` below)
#
# Why we need the GUI prereqs
# - PySide6/Qt requires native shared libs (libEGL, libGL, XCB) to import QtGui
# - Xvfb provides a virtual X server so Qt can initialize in headless CI
#
# Notes / Maintenance
# - Auto-commit requires: permissions.contents=write and checkout fetch-depth: 0
# - If switching to check-only linting:
#     - Remove the auto-fix phase
#     - Use `ruff check .` and `black --check .`
#     - Set permissions.contents: read
# - Keep pytest.ini with: qt_api = pyside6
# - Concurrency cancels in-progress runs on the same ref to save compute
# -----------------------------------------------------------------------------

name: CI (Branches)

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'bugfix/*'
      - 'hotfix/*'
      - 'release/*'

permissions:
  contents: write  # required for auto-commit of pre-commit fixes

concurrency:
  group: ci-branches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Install system libs for Qt + Xvfb
        if: runner.os == 'Linux'
        run: |
          # The runner image ships apt sources for packages.microsoft.com, which this project
          # never installs from. A 403 there fails `apt-get update` with exit 100 even when
          # every Ubuntu repo fetched fine, which took the whole job down on 2026-09-02.
          # Matches on the repo host, not the filename, so an image rename cannot silently
          # reinstate it. `grep` exits 1 when it matches nothing and steps run under `bash -e`,
          # so the `|| true` is load-bearing - without it the guard fails the step it protects.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            xvfb

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pip install -e ".[dev]" || \
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Clear pre-commit cache
        if: runner.os == 'Linux'
        run: pre-commit clean

      # ---------------------------------------------------------------------
      # Phase 1: Auto-fix (never fails)
      # ---------------------------------------------------------------------
      - name: Run pre-commit auto-fix (non-blocking)
        if: runner.os == 'Linux'
        run: |
          pre-commit run --all-files --hook-stage manual || true

      - name: Commit and push pre-commit fixes
        if: runner.os == 'Linux'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-fix via pre-commit hooks"
            git push
          fi

      # ---------------------------------------------------------------------
      # Phase 2: Strict validation (must pass)
      # ---------------------------------------------------------------------
      - name: Run pre-commit validation
        if: runner.os == 'Linux'
        run: |
          pre-commit run --all-files

      # ---------------------------------------------------------------------
      # Project-environment mypy report (non-blocking)
      # ---------------------------------------------------------------------
      # The pre-commit mypy hook runs in an isolated environment with no project
      # dependencies, so PySide6, numpy and pandas are all `Any` to it and it cannot
      # see, for instance, a controller calling a method its View does not have. This
      # run uses the installed project and reports the real count. It does not gate:
      # the figure is tracked in future_fixes.md and DECISIONS.md (2026-08-24), and the
      # known noise (Qt short-form enum accesses, untyped imports) would fail every run.
      - name: Project-environment mypy report
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python -m mypy poriscope | tail -n 1

      # ---------------------------------------------------------------------
      # Tests
      # ---------------------------------------------------------------------
      # Runs the whole suite, e2e included - no marker filter. At ~6 minutes the
      # e2e tests are worth their cost.
      - name: Run tests under Xvfb
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pytest -q

      # Qt needs no display server here: QT_QPA_PLATFORM=offscreen is set at job
      # level and the e2e tests drive real widgets against that platform plugin.
      - name: Run tests (Windows, offscreen)
        if: runner.os == 'Windows'
        run: |
          pytest -q

  # ---------------------------------------------------------------------------
  # Wheel smoke: the suite above runs against `pip install -e`, which never
  # exercises what a user installs. This builds the distributions, checks them
  # as PyPI would, installs the wheel into a fresh venv and, from a directory
  # outside the checkout so the source tree cannot shadow it, imports the package
  # and loads the wavelet binary the way WaveletFilter does. The venv is
  # constrained to requirements.txt so it resolves the versions the suite ran
  # against rather than the newest the ranges in pyproject.toml admit.
  # ---------------------------------------------------------------------------
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12.10'

      # Importing poriscope.exposed imports PySide6's QtWidgets, whose bundled Qt
      # needs these three system libraries present even offscreen.
      - name: Install Qt system libs
        if: runner.os == 'Linux'
        run: |
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel into a fresh venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          # The venv's interpreter sits under bin/ on Linux and Scripts/ on Windows.
          PY="$RUNNER_TEMP/smoke/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/smoke/Scripts/python.exe"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl -c requirements.txt

      - name: Import the package and load the wavelet binary
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          PY="$RUNNER_TEMP/smoke/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/smoke/Scripts/python.exe"
          "$PY" - <<'EOF'
          import ctypes
          import importlib.resources
          import platform

          import poriscope
          import poriscope.exposed

          ext = {"Windows": ".dll", "Linux": ".so", "Darwin": ".dylib"}[platform.system()]
          path = importlib.resources.files("poriscope") / "cdlls" / "wavelet" / "dist" / f"wavelet{ext}"
          lib = ctypes.cdll.LoadLibrary(str(path))
          assert hasattr(lib, "filter_signal_wt"), "wavelet binary loaded but exports no filter_signal_wt"
          print(f"poriscope {poriscope.__VERSION__} imported from {poriscope.__file__}; wavelet binary loaded from {path}")
          EOF
