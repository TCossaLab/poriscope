# CI (Branches)
# -----------------------------------------------------------------------------
# What it does
# - Runs on branch pushes to: develop, feature/*, bugfix/*
# - Installs Linux GUI prereqs for PySide6 (EGL/GL/XCB) + Xvfb virtual display
# - Sets up Python, caches pip by requirements files
# - Installs runtime + dev deps
# - Runs pre-commit in two phases:
#     1) Auto-fix (non-blocking)
#     2) Strict validation (blocking)
# - Commits auto-fixes back to the branch if needed
# - Runs tests marked "not e2e and not slow" under Xvfb
#
# Why we need the GUI prereqs
# - PySide6/Qt requires native shared libs (libEGL, libGL, XCB) to import QtGui
# - Xvfb provides a virtual X server so Qt can initialize in headless CI
#
# Notes / Maintenance
# - Auto-commit requires: permissions.contents=write and checkout fetch-depth: 0
# - If switching to check-only linting:
#     - Remove the auto-fix phase
#     - Use `ruff check .` and `black --check .`
#     - Set permissions.contents: read
# - Keep pytest.ini with: qt_api = pyside6
# - Concurrency cancels in-progress runs on the same ref to save compute
# -----------------------------------------------------------------------------

name: CI (Branches)

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'bugfix/*'

permissions:
  contents: write  # required for auto-commit of pre-commit fixes

concurrency:
  group: ci-branches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system libs for Qt + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Clear pre-commit cache
        run: pre-commit clean

      # ---------------------------------------------------------------------
      # Phase 1: Auto-fix (never fails)
      # ---------------------------------------------------------------------
      - name: Run pre-commit auto-fix (non-blocking)
        run: |
          pre-commit run --all-files --hook-stage manual || true

      - name: Commit and push pre-commit fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-fix via pre-commit hooks"
            git push
          fi

      # ---------------------------------------------------------------------
      # Phase 2: Strict validation (must pass)
      # ---------------------------------------------------------------------
      - name: Run pre-commit validation
        run: |
          pre-commit run --all-files

      # ---------------------------------------------------------------------
      # Tests
      # ---------------------------------------------------------------------
      - name: Run tests (no slow/e2e) under Xvfb
        run: |
          xvfb-run -a pytest -q -m "not e2e and not slow"
