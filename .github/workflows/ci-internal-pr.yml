# CI (Internal PR)
# ----------------
# This workflow runs on internal pull requests targeting `main` or `release/*`.
#
# What it does:
# - Installs Linux system dependencies required for PySide6 / Qt
# - Installs the project with development dependencies
# - Runs pre-commit auto-fix hooks (manual stage)
# - Commits and pushes any auto-fixes
# - Runs strict pre-commit validation (must pass)
# - Runs the full test suite (unit + integration + e2e) under Xvfb
# - Collects and uploads coverage data
#
# Notes:
# - This workflow is NOT safe for forks (write permissions required)
# - Auto-fix + strict validation mirrors Branch CI behavior
# - Full test suite provides higher confidence before merge

name: CI (Internal PR)

on:
  pull_request:
    branches: [main, release/*]
    types: [opened, synchronize, reopened]

permissions:
  contents: write  # required to commit and push auto-fixes

concurrency:
  group: ci-internal-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Set up Python
      # ------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      # ------------------------------------------------------------
      # Install system dependencies for Qt / PySide6
      # ------------------------------------------------------------
      - name: Install Linux system dependencies for Qt & GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcomposite1 \
            libxrandr2 \
            libxi6 \
            libxtst6 \
            xvfb

      # ------------------------------------------------------------
      # Install Python dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pip install -e ".[dev]" || \
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # 1. Run auto-fix hooks (manual stage only)
      # ------------------------------------------------------------
      - name: Run pre-commit auto-fix hooks
        run: |
          pre-commit run --all-files --hook-stage manual || true

      # ------------------------------------------------------------
      # 2. Commit and push any auto-fixes
      # ------------------------------------------------------------
      - name: Commit and push pre-commit fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-fix via pre-commit hooks"
            git push
          fi

      # ------------------------------------------------------------
      # 3. Strict validation (must pass)
      # ------------------------------------------------------------
      - name: Run pre-commit validation
        run: |
          pre-commit run --all-files

      # ------------------------------------------------------------
      # 4. Run full test suite (unit + integration + e2e)
      # ------------------------------------------------------------
      - name: Run full test suite (headless with GUI support)
        run: |
          xvfb-run -a pytest -q --maxfail=1 --disable-warnings \
            --cov=poriscope --cov-report=xml

      # ------------------------------------------------------------
      # 5. Upload coverage report
      # ------------------------------------------------------------
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Print coverage summary
        run: |
          python - <<EOF
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          rate = float(root.attrib.get("line-rate", 0)) * 100
          print(f"::notice::Line Coverage: {rate:.2f}%")
          EOF
