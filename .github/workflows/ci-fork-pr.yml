# CI (Fork PR)
# ------------
# Validation-only CI for pull requests from forks.
# This workflow never modifies code and never pushes commits.
#
# It performs:
# - Strict pre-commit validation (no auto-fixes)
# - Static typing checks
# - Fast test suite under Xvfb
#
# Contributors must run auto-fix hooks locally before opening a PR.

name: CI (Fork PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: read  # fork-safe

concurrency:
  group: ci-fork-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.10"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies for Qt + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # ------------------------------------------------------------
      # Strict validation only (NO auto-fix, NO file modification)
      # ------------------------------------------------------------
      - name: Run pre-commit validation
        run: |
          pre-commit run --all-files

      # Runs the whole suite - no marker filter. ~6 minutes.
      - name: Run tests under Xvfb
        run: |
          xvfb-run -a pytest -q
