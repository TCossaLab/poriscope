# Docs Render Check
# -----------------
# Verifies that the Sphinx documentation still builds cleanly on every pull
# request, with warnings treated as errors.
#
# Why this exists separately from the docs deploy workflow:
# build_and_deploy_docs.yml only runs on push to main, i.e. after merge, so a
# docstring that is pydoclint-clean but breaks rendering used to surface only
# once it was already published.
#
# Why this is its own workflow rather than a job in the two PR workflows:
# neither ci-fork-pr.yml nor ci-internal-pr.yml filters on whether the PR comes
# from a fork, so a PR targeting main fires both of them. A job added to both
# would render the docs twice on every internal PR, and a job added only to
# ci-fork-pr.yml would miss PRs targeting release/*.
#
# This job needs no Qt, no Xvfb and no wavelet binary: conf.py mocks PySide6 for
# autodoc, and the .rst generators under scripts/autodoc/ are pure ast parsers
# that never import the package.

name: Docs Render Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, 'release/*']
  workflow_dispatch:

permissions:
  contents: read  # fork-safe: this job only builds, it never publishes

concurrency:
  group: docs-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt, not the [docs] extra: sphinx/sphinx-tabs/furo are
      # pinned there alongside the numpy/scipy/pandas/sklearn stack that
      # autodoc needs in order to import the modules it documents. The [docs]
      # extra carries only the three Sphinx packages, and [dev] carries no
      # Sphinx at all.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Mandatory: docs/source/autodoc/ is gitignored, so a fresh checkout has
      # none of the generated .rst files that index.rst's toctrees reference.
      - name: Generate autodoc .rst files
        run: |
          python scripts/generate_all_autodoc_rst.py

      # -W turns warnings into errors; --keep-going reports all of them in one
      # pass instead of stopping at the first.
      - name: Build docs with warnings as errors
        run: |
          sphinx-build -W --keep-going -b html docs/source docs/build

      - name: Upload rendered docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html-${{ github.sha }}
          path: docs/build
          retention-days: 7
          if-no-files-found: ignore
