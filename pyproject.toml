[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "poriscope"
dynamic = ["version"]
description = "A tool for selecting and analyzing nanopore data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kyle Briggs & Alejandra Carolina González González", email = "kbriggs@uottawa.ca" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PySide6==6.9.0",
    "numpy==2.2.6",
    "matplotlib==3.10.3",
    "pandas==2.2.3",
    "platformdirs==4.3.8",
    "scipy==1.15.3",
    "kneed==0.8.5",
    "fast-histogram==0.14",
    "scikit-learn==1.6.1",
    "hdbscan==0.8.40",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "ruff==0.12.11",
    "mypy==1.9.0",
    "pydoclint==0.9.1",
    "pytest==8.4.1",
    "pytest-mock==3.14.1",
    "pytest-qt==4.5.0",
    "pytest-timeout==2.4.0",
]
docs = [
    "sphinx==8.2.3",
    "sphinx-tabs==3.4.7",
    "furo==2024.8.6",
]

[project.urls]
Homepage = "https://github.com/TCossaLab/poriscope"

[project.scripts]
poriscope = "poriscope.main_app:main"

[tool.setuptools.dynamic]
version = {attr = "poriscope.constants.__VERSION__"}

[tool.setuptools.package-data] 
poriscope = [
    "configs/icons/*",
    "cdlls/wavelet/dist/*.dll",
    "cdlls/wavelet/dist/*.so",
    "cdlls/wavelet/dist/*.dylib",
]

[tool.ruff]
line-length = 88
src = ["poriscope", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["poriscope", "tests"]
known-third-party = ["PySide6", "matplotlib", "pytest", "numpy", "pandas"]
combine-as-imports = true

[tool.pydoclint]
style = "sphinx"
# Most plugin methods intentionally omit signature type hints and rely on
# ":type:"/":rtype:" in the docstring instead (see mypy.ini's
# disallow_untyped_defs=False) - only check that documented param/return
# names, order, and presence match the real signature, not that hints exist
# in the signature itself.
arg-type-hints-in-signature = false
# Every __init__ in this codebase has its own docstring separate from the
# class docstring; that's an established convention here, not a violation.
allow-init-docstring = true
exclude = "^tests/"
